<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="1000" height="520" fill="#FFFFFF" />

  <!-- ==================== CENTRAL SYSTEM CONTAINER ==================== -->
  <rect x="290" y="50" width="420" height="410" rx="16" fill="#FBFBFB" stroke="#000000" stroke-width="2.5" />

  <!-- System Header Text -->
  <text x="500" y="92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="1">
    SISTEM INFORMASI LAYANAN
  </text>
  <text x="500" y="114" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="1">
    PEMESANAN KONTEN MEDKREMINFO
  </text>

  <!-- Inner Function 1: Ajukan & Kelola Pesanan -->
  <g transform="translate(315, 145)">
    <rect width="175" height="70" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="87" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">
      Pemesanan Konten
    </text>
    <text x="87" y="49" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#333333" text-anchor="middle">
      (Multi-Kanal &amp; Brief)
    </text>
  </g>

  <!-- Inner Function 2: Validasi & Penugasan Staf -->
  <g transform="translate(510, 145)">
    <rect width="175" height="70" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="87" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">
      Validasi &amp; Disposisi
    </text>
    <text x="87" y="49" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#333333" text-anchor="middle">
      (Penugasan Eksekutor)
    </text>
  </g>

  <!-- Inner Function 3: Pelacakan Progres & Revisi -->
  <g transform="translate(315, 240)">
    <rect width="175" height="70" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="87" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">
      Pelacakan Status
    </text>
    <text x="87" y="49" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#333333" text-anchor="middle">
      (Review &amp; Kuota Revisi)
    </text>
  </g>

  <!-- Inner Function 4: Kalender Editorial & Publikasi -->
  <g transform="translate(510, 240)">
    <rect width="175" height="70" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="87" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">
      Kalender Editorial
    </text>
    <text x="87" y="49" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#333333" text-anchor="middle">
      (&amp; Publikasi Konten)
    </text>
  </g>

  <!-- Footer Note inside System -->
  <text x="500" y="435" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#555555" text-anchor="middle" font-style="italic">
    BEM FT UNSOED Ticketing &amp; Workflow Management Engine
  </text>


  <!-- ==================== EXTERNAL ACTOR 1: KLIEN (LEFT) ==================== -->
  <g transform="translate(40, 215)">
    <rect width="170" height="85" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    <text x="85" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#000000" text-anchor="middle">
      Klien
    </text>
    <text x="85" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#333333" text-anchor="middle">
      (14 Kementerian)
    </text>
  </g>

  <!-- Connection: Klien <-> System -->
  <line x1="218" y1="257.5" x2="282" y2="257.5" stroke="#000000" stroke-width="1.8" />
  <polygon points="218,252.5 210,257.5 218,262.5" fill="#000000" />
  <polygon points="282,252.5 290,257.5 282,262.5" fill="#000000" />
  <text x="250" y="235" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">
    brief, aset
  </text>
  <text x="250" y="249" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">
    / status, draf
  </text>


  <!-- ==================== EXTERNAL ACTOR 2: ADMIN (RIGHT TOP) ==================== -->
  <g transform="translate(790, 115)">
    <rect width="170" height="85" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    <text x="85" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#000000" text-anchor="middle">
      Admin
    </text>
    <text x="85" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#333333" text-anchor="middle">
      (Menteri Medkreminfo)
    </text>
  </g>

  <!-- Connection: System <-> Admin -->
  <line x1="718" y1="157.5" x2="782" y2="157.5" stroke="#000000" stroke-width="1.8" />
  <polygon points="718,152.5 710,157.5 718,162.5" fill="#000000" />
  <polygon points="782,152.5 790,157.5 782,162.5" fill="#000000" />
  <text x="750" y="138" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">
    validasi brief
  </text>
  <text x="750" y="152" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">
    &amp; penugasan
  </text>


  <!-- ==================== EXTERNAL ACTOR 3: EKSEKUTOR (RIGHT BOTTOM) ==================== -->
  <g transform="translate(790, 305)">
    <rect width="170" height="85" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    <text x="85" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#000000" text-anchor="middle">
      Eksekutor
    </text>
    <text x="85" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#333333" text-anchor="middle">
      (Staf Medkreminfo)
    </text>
  </g>

  <!-- Connection: System <-> Eksekutor -->
  <line x1="718" y1="347.5" x2="782" y2="347.5" stroke="#000000" stroke-width="1.8" />
  <polygon points="718,342.5 710,347.5 718,352.5" fill="#000000" />
  <polygon points="782,342.5 790,347.5 782,352.5" fill="#000000" />
  <text x="750" y="328" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">
    eksekusi tugas
  </text>
  <text x="750" y="342" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">
    &amp; unggah draf
  </text>

</svg>
