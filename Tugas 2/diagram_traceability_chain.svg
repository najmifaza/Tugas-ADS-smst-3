<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <!-- Canvas Background -->
  <rect width="1000" height="280" fill="#FFFFFF" />

  <!-- Diagram Title -->
  <text x="500" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="0.5">
    Traceability Chain – Layanan Pemesanan Konten Medkreminfo
  </text>

  <!-- ==================== NODE 1: EVIDENCE ==================== -->
  <g transform="translate(30, 65)">
    <rect width="160" height="85" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <text x="80" y="28" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#000000" text-anchor="middle">
      Evidence (W02)
    </text>
    <text x="80" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">
      Pesanan tenggelam
    </text>
    <text x="80" y="66" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">
      di chat WhatsApp
    </text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="107.5" x2="220" y2="107.5" stroke="#000000" stroke-width="2" />
  <polygon points="220,103 228,107.5 220,112" fill="#000000" />

  <!-- ==================== NODE 2: PAIN POINT ==================== -->
  <g transform="translate(228, 65)">
    <rect width="160" height="85" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <text x="80" y="28" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#000000" text-anchor="middle">
      Pain Point (PP-01)
    </text>
    <text x="80" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">
      Status pengerjaan
    </text>
    <text x="80" y="66" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">
      tidak terlihat pemesan
    </text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="388" y1="107.5" x2="418" y2="107.5" stroke="#000000" stroke-width="2" />
  <polygon points="418,103 426,107.5 418,112" fill="#000000" />

  <!-- ==================== NODE 3: FUNCTIONAL REQUIREMENT ==================== -->
  <g transform="translate(426, 65)">
    <rect width="160" height="85" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <text x="80" y="28" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#000000" text-anchor="middle">
      FR-05
    </text>
    <text x="80" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">
      Tampilkan status tiket
    </text>
    <text x="80" y="66" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">
      secara real-time
    </text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="586" y1="107.5" x2="616" y2="107.5" stroke="#000000" stroke-width="2" />
  <polygon points="616,103 624,107.5 616,112" fill="#000000" />

  <!-- ==================== NODE 4: ACCEPTANCE CRITERIA ==================== -->
  <g transform="translate(624, 65)">
    <rect width="160" height="85" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <text x="80" y="28" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#000000" text-anchor="middle">
      AC-06
    </text>
    <text x="80" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">
      Status tampil = status
    </text>
    <text x="80" y="66" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">
      tahapan di database
    </text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="784" y1="107.5" x2="814" y2="107.5" stroke="#000000" stroke-width="2" />
  <polygon points="814,103 822,107.5 814,112" fill="#000000" />

  <!-- ==================== NODE 5: NEXT MODEL ==================== -->
  <g transform="translate(822, 65)">
    <rect width="160" height="85" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <text x="80" y="28" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#000000" text-anchor="middle">
      Next Model
    </text>
    <text x="80" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">
      UC Lacak Progres /
    </text>
    <text x="80" y="66" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">
      State Diagram Tiket
    </text>
  </g>

  <!-- Principle Note -->
  <text x="500" y="195" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#555555" text-anchor="middle" font-style="italic">
    Prinsip: setiap artefak penting memiliki alasan keberadaan dan hubungan yang dapat ditelusuri.
  </text>

  <!-- Figure Caption -->
  <text x="500" y="240" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#333333" text-anchor="middle">
    Gambar 2. Contoh rantai traceability dari evidence sampai model berikutnya.
  </text>
</svg>
